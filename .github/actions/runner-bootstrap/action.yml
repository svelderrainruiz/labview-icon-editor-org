name: Runner Bootstrap (Stateless)
description: Initializes the LVIE runner contract and validates runner sanity for the current job.
inputs:
  initialize_runner:
    description: Initialize runner contract and export LVIE_* variables.
    required: false
    default: 'true'
  runner_sanity:
    description: Run Tooling/Check-Runner.ps1.
    required: false
    default: 'true'
  runner_label_check:
    description: Validate runner labels against expected contract.
    required: false
    default: 'true'
  safe_directory_scope:
    description: Git safe.directory scope (System or Global).
    required: false
    default: Global
runs:
  using: composite
  steps:
    - name: Initialize runner (stateless)
      if: ${{ inputs.initialize_runner == 'true' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $contractPath = Join-Path $env:RUNNER_WORKSPACE 'lvie' 'runner-contract.json'
        $runnerCliProject = Join-Path $env:GITHUB_WORKSPACE 'Tooling\runner-cli\RunnerCli\RunnerCli.csproj'
        $runnerCliDll = Join-Path $env:GITHUB_WORKSPACE 'Tooling\runner-cli\RunnerCli\bin\Release\net8.0\runner-cli.dll'
        $runnerLabel = if ([string]::IsNullOrWhiteSpace($env:LVIE_EXPECTED_RUNNER_LABEL)) { $env:LVIE_RUNNER_LABEL } else { $env:LVIE_EXPECTED_RUNNER_LABEL }
        if ([string]::IsNullOrWhiteSpace($runnerLabel)) { $runnerLabel = 'self-hosted-windows-lv' }
        $canonicalLabel = if ([string]::IsNullOrWhiteSpace($env:LVIE_CANONICAL_RUNNER_LABEL)) { 'self-hosted-windows-lv' } else { $env:LVIE_CANONICAL_RUNNER_LABEL }
        $runnerCliReady = $false

        if ((Test-Path -Path $runnerCliProject) -and (Get-Command dotnet -ErrorAction SilentlyContinue)) {
          Write-Host 'Building runner-cli in place (framework-dependent DLL) ...'
          & dotnet build $runnerCliProject --configuration Release /p:SelfContained=false /p:UseAppHost=false
          if (($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq $null) -and (Test-Path -Path $runnerCliDll)) {
            $runnerCliReady = $true
          } else {
            Write-Warning ("In-place runner-cli build did not produce expected DLL: {0}" -f $runnerCliDll)
          }
        }

        if ($runnerCliReady) {
          Write-Host ("Using in-place runner-cli DLL at {0}" -f $runnerCliDll)
          & dotnet $runnerCliDll init-contract `
            --contract-path $contractPath `
            --runner-root   (Split-Path $env:RUNNER_WORKSPACE) `
            --work-root     $env:RUNNER_WORKSPACE `
            --runner-label  $runnerLabel `
            --canonical-label $canonicalLabel
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
            throw ("runner-cli init-contract failed (exit {0})." -f $LASTEXITCODE)
          }

          & dotnet $runnerCliDll emit-env --contract-path $contractPath
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
            throw ("runner-cli emit-env failed (exit {0})." -f $LASTEXITCODE)
          }
        } else {
          Write-Host 'runner-cli in-place build unavailable; using PowerShell fallback.'
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\Tooling\Initialize-Runner.ps1" -WriteGitHubEnv
        }
    - name: Runner sanity
      if: ${{ inputs.runner_sanity == 'true' }}
      shell: pwsh
      run: |
        $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'Tooling\Check-Runner.ps1'
        if (-not (Test-Path -Path $scriptPath)) {
          Write-Warning "Check-Runner.ps1 not found at $scriptPath. Skipping runner sanity."
          exit 0
        }
        pwsh -NoProfile -File $scriptPath -SafeDirectoryScope ${{ inputs.safe_directory_scope }}
    - name: Runner label contract
      if: ${{ inputs.runner_label_check == 'true' }}
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'Tooling\Assert-RunnerLabel.ps1'
        if (-not (Test-Path -Path $scriptPath)) {
          Write-Warning "Assert-RunnerLabel.ps1 not found at $scriptPath. Skipping runner label check."
          exit 0
        }
        pwsh -NoProfile -File $scriptPath
