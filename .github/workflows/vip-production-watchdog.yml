name: VIP Production Watchdog

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  vip-production-watchdog:
    name: VIP Production Watchdog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: watchdog
        name: Assert latest develop VIP guarantee
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/Tooling/Assert-DevelopVipGuarantee.ps1" `
            -Repository '${{ github.repository }}' `
            -Branch develop `
            -WorkflowFile ci.yml `
            -OutputPath "$env:GITHUB_WORKSPACE/builds/status/develop-vip-guarantee.json"

      - name: Upload watchdog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vip-production-watchdog
          path: builds/status/develop-vip-guarantee.json
          if-no-files-found: error

      - name: Open or update watchdog tracking issue
        if: ${{ steps.watchdog.outcome != 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[Watchdog] develop VIP production guarantee failed';
            const reportPath = path.join(process.env.GITHUB_WORKSPACE || process.cwd(), 'builds', 'status', 'develop-vip-guarantee.json');
            let reportText = '(report missing)';
            if (fs.existsSync(reportPath)) {
              reportText = fs.readFileSync(reportPath, 'utf8');
            }
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              'The latest `develop` head does not satisfy the VIP production guarantee.',
              '',
              `- Run: ${runUrl}`,
              `- Detected at: ${new Date().toISOString()}`,
              '',
              '```json',
              reportText,
              '```',
            ].join('\n');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              const updatedBody = `${existing.body || ''}\n\n---\n\n${body}`;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body: updatedBody,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }

      - name: Fail when watchdog contract is broken
        if: ${{ steps.watchdog.outcome != 'success' }}
        shell: pwsh
        run: |
          throw 'VIP production watchdog failed; tracking issue opened/updated.'
